name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test
      - run: node scripts/build-single.mjs
      # dist/bidgate.html is committed for anyone who wants a single downloadable file — CI proves it's
      # never allowed to drift from src by rebuilding it here and failing if that changes anything.
      - run: git diff --exit-code dist/
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with: { name: bidgate-single-file, path: dist/bidgate.html }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-single.mjs
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
